[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planalyst"
version = "0.1.0"
description = "PLanalyst — Premier League News Sentiment vs Match Outcome Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Ingestion
    "dlt[postgres]>=1.0.0",
    # Transformation
    "dbt-postgres>=1.8.0",
    # Orchestration
    "dagster>=1.7.0",
    "dagster-dbt>=0.23.0",
    "dagster-webserver>=1.7.0",
    # Data Quality
    "great_expectations>=1.0.0",
    # NLP
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentencepiece>=0.2.0",
    # ML & Data
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "mlflow>=3.16.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    # API Serving
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Dashboard
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "altair>=5.3.0",
    # Data Sources
    "newsapi-python>=0.2.7",
    "requests>=2.32.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Env
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "ipython>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["planalyst*", "streamlit_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py311"]
