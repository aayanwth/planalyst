[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planalyst"
version = "0.1.0"
description = "PLanalyst — Premier League News Sentiment vs Match Outcome Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aayan"}]

# Core: configuration, database access and data handling. Everything heavier is an extra so
# CI and the API/dashboard images do not have to install torch, dbt or Dagster.
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
ingestion = [
    "dlt[postgres]>=1.0.0",
]
transform = [
    "dbt-postgres>=1.8.0",
    "great_expectations>=1.0.0",
]
nlp = [
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "sentencepiece>=0.2.0",
    "scikit-learn>=1.4.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
]
tracking = [
    "mlflow>=3.16.1",
]
orchestration = [
    "dagster>=1.7.0",
    "dagster-dbt>=0.23.0",
    "dagster-webserver>=1.7.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]
dashboard = [
    "streamlit>=1.50.0",
    "plotly>=5.22.0",
    "altair>=5.3.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]
all = [
    "planalyst[ingestion,transform,nlp,ml,tracking,orchestration,api,dashboard]",
]

[tool.setuptools.packages.find]
include = ["planalyst*", "streamlit_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Line length is left to black; long SQL strings and URLs would otherwise dominate the report.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# run_ge.py is a linear demo script that deliberately imports after printing a banner.
"scripts/run_ge.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
